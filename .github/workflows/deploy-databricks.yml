name: Deploy Databricks Bundle

on:
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate DEV bundle
        working-directory: adf/databricks
        run: databricks bundle validate -t dev

      - name: Deploy DEV bundle
        working-directory: adf/databricks
        run: databricks bundle deploy -t dev

  deploy-test:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: test

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate TEST bundle
        working-directory: adf/databricks
        run: databricks bundle validate -t test

      - name: Deploy TEST bundle
        working-directory: adf/databricks
        run: databricks bundle deploy -t test

  deploy-prod:
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate PROD bundle
        working-directory: adf/databricks
        run: databricks bundle validate -t prod

      - name: Deploy PROD bundle
        working-directory: adf/databricks
        run: databricks bundle deploy -t prod
